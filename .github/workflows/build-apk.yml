name: Build Al Azhar WebView APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'android-webview/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Prepare SDK 34
        run: |
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDK_MANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: android-webview
        run: gradle assembleDebug --no-daemon

      - name: Upload WebView APK
        uses: actions/upload-artifact@v4
        with:
          name: Al-Azhar-WebView-APK
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
